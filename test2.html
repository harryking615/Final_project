<!doctype html>
<html>
  <body>
    <label for="box-border">My Box</label>
    <select id="box-border">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>

    <div class="box">My Box</div>

    <style>
      .box {
        border: var(--box-border);
        padding: 20px;
      }
    </style>

<script>
  const boxBorder = document.getElementById("box-border");

  function setBoxBorder() {
    document.documentElement.style.setProperty(
      "--box-border",
      boxBorder.value === "yes" ? "2px solid black" : "none"
    );
  }

  // Set the initial value
  setBoxBorder();

  // Update whenever the selection changes
  boxBorder.addEventListener("change", setBoxBorder);
</script>

</body>
</html>
