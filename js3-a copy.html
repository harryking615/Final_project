<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- The lines of code you want to show or hide -->
    <div id="secret-code" style="display: none">
      <h1 style="color: darkblue">Learn More Information</h1>
      <form action=" " method="post">
        <label for="name">Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          placeholder="John Doe"
        />
        <p></p>
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="john@doe.com"
        />
      </form>
    </div>
    <p></p>
    <!-- A button to trigger the display -->
    <button onclick="revealCode()">Learn More</button>

    <script>
      function revealCode() {
        var x = document.getElementById("secret-code");

        // If the text is currently hidden, show it
        if (x.style.display === "none") {
          x.style.display = "block";
        }
        // Otherwise (if it's already showing), hide it
        else {
          x.style.display = "none";
        }
      }
    </script>
  </body>
</html>
